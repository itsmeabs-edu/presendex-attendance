<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf8fa">
  <link rel="icon" type="image/png" href="/icon.png">
  <title>Sign in · PresenDex</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/login.js" defer></script>
</head>
<body class="auth-page">
  <header class="auth-header"><a class="brand" href="/"><img src="/logo.svg" alt="PresenDex home"></a><a class="text-link" href="/">Back to home</a></header>
  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-icon">↗</div>
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in to your school</h1>
      <p class="muted">Use the username and password provided by your school admin.</p>
      <form id="login-form" class="stacked-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
        <button class="button button-primary button-wide" type="submit">Sign in</button>
      </form>
      <p class="auth-footnote">New school setup? <a href="/setup">Create the first admin account</a></p>
    </section>
  </main>
</body>
</html>
