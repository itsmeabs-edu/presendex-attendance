<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf8fa">
  <title>School setup · PresenDex</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/setup.js" defer></script>
</head>
<body class="auth-page">
  <header class="auth-header"><a class="brand" href="/"><img src="/logo.png" alt="PresenDex home"></a><a class="text-link" href="/">Back to home</a></header>
  <main class="auth-main">
    <section class="auth-card auth-card-wide">
      <div class="auth-icon">✦</div>
      <p class="eyebrow">One-time school setup</p>
      <h1>Create the admin account</h1>
      <p class="muted">The admin manages classes, teachers, and school setup. This account can only be created once on this computer.</p>
      <form id="setup-form" class="stacked-form">
        <label for="full-name">Admin's name</label>
        <input id="full-name" name="full_name" autocomplete="name" minlength="2" maxlength="120" required>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" minlength="3" maxlength="60" pattern="[A-Za-z0-9._-]+" required>
        <label for="password">Password <span class="label-hint">Use at least 12 characters</span></label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        <p id="setup-message" class="form-message" role="status" aria-live="polite"></p>
        <button class="button button-primary button-wide" type="submit">Create admin account</button>
      </form>
      <p class="auth-footnote">Already set up? <a href="/login">Sign in</a></p>
    </section>
  </main>
</body>
</html>
